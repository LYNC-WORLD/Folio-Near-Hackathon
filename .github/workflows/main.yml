
name: Deploy to Saga Server

on:
  push:
    branches:
      - main
      - staging

jobs:
  Deploy:
    name: Deploy to Saga Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.serverIp }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e

            if [ "${{ github.ref_name }}" = "main" ]; then
              APP_DIR="folio-be"
              BRANCH="main"
              PROJECT="folio-prod"

              echo "Deploying PRODUCTION..."

            elif [ "${{ github.ref_name }}" = "staging" ]; then
              APP_DIR="folio-be-staging"
              BRANCH="staging"
              PROJECT="folio-staging"

              echo "Deploying STAGING..."

            else
              echo "Invalid branch"
              exit 1
            fi

            cd "$APP_DIR"

            export COMPOSE_PROJECT_NAME="$PROJECT"

            echo "Docker project: $COMPOSE_PROJECT_NAME"
            echo "Application directory: $APP_DIR"

            echo "Pulling latest code..."
            git pull https://${{ secrets.GIT_HUB_USER_NAME }}:${{ secrets.GIT_HUB_SECRET }}@github.com/LYNC-WORLD/folio-backend.git "$BRANCH"

            echo "Stopping existing containers..."
            docker compose down

            echo "Building and starting containers..."
            docker compose up -d --build

            echo "Running containers for ${PROJECT}:"
            docker compose ps

            echo "Deployment completed successfully."