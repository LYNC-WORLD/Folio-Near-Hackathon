services:
  user-management:
    build:
      context: ./user-management-service
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT}:5010"
    env_file:
      - ./user-management-service/.env
    restart: unless-stopped

  pricing:
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
    env_file:
      - ./pricing-service/.env
    restart: unless-stopped